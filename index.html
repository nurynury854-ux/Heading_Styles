<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heading Styles</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      background-color: white;
      padding: 20px;
    }

    /* The white box with the gray shadow around it */
    .box {
      max-width: 900px;
      background-color: white;
      padding: 10px 20px;
      box-shadow: 0 0 10px 4px #888;
    }

    /* Heading 1: thick black line on top + pink text shadow */
    h1 {
      display: inline-block;          /* makes the top line only as wide as the text */
      border-top: 6px solid black;
      text-shadow: 3px 3px 2px pink;
      font-size: 48px;
      margin: 0 0 25px 0;
    }

    /* Heading 2: italic, thin black border with a yellow outline */
    h2 {
      font-style: italic;
      font-size: 36px;
      border: 2px solid black;
      outline: 4px outset yellow;
      padding: 2px 4px;
      margin: 0 0 30px 0;
    }

    /* Heading 3: underlined and pushed to the right */
    h3 {
      text-align: right;
      text-decoration: underline;
      font-size: 28px;
      margin: 0 0 10px 0;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>
  </div>

</body>
</html>
